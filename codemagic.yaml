    integrations:
      app_store_connect: ironheroes_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.kerkerlai.nyepartyera
      vars:
        BUNDLE_ID: com.kerkerlai.nyepartyera
    triggering:
      events: []
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: App SW QA tests
        script: flutter test
      - name: Set iOS Bundle Identifier (Runner & RunnerTests)
        script: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*RunnerTests;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}.RunnerTests;/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "/RunnerTests/!s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" ios/Runner.xcodeproj/project.pbxproj
      - name: Prepare iOS config & CocoaPods (if used)
        script: |
          flutter build ios --config-only --no-codesign
