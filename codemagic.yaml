            cd ios && pod install --repo-update
          fi
      - name: Apply Ad Hoc provisioning profiles
        script: xcode-project use-profiles
      - name: Build Ad Hoc IPA
        script: |
          flutter build ipa --release \
            --build-number=$((BUILD_NUMBER + 100)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-apk:
    name: Android → APK + AAB (跨年英雄紀元)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 21
    triggering:
      events: []
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: App SW QA tests
        script: flutter test
      - name: Build Release APK
        script: flutter build apk --release --build-number=$((BUILD_NUMBER + 1))
      - name: Build Release AAB
        script: flutter build appbundle --release --build-number=$((BUILD_NUMBER + 1))
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
