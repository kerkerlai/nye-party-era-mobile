# Codemagic CI/CD — 《跨年英雄紀元》(iOS TestFlight + Android APK/AAB)
# 沿用你《鋼鐵英雄 2.0》的 App Store Connect API 整合名稱 (ironheroes_asc)，免 Mac 雲端自動打包！

workflows:
  ios-testflight:
    name: iOS → TestFlight (跨年英雄紀元)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ironheroes_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kerkerlai.nyepartyera
      vars:
        BUNDLE_ID: com.kerkerlai.nyepartyera
        APP_STORE_APPLE_ID: "6832899646"
        # 新版 altool 無法自動由 Bundle ID 反查 App 時，直接指定 App 的數字 Apple ID
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--apple-id 6832899646"
    triggering:
      events: []
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: App SW QA tests
        script: flutter test
      - name: Set iOS Bundle Identifier (Runner & RunnerTests)
        script: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*RunnerTests;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}.RunnerTests;/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "/RunnerTests/!s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" ios/Runner.xcodeproj/project.pbxproj
      - name: Prepare iOS config & CocoaPods (if used)
        script: |
          flutter build ios --config-only --no-codesign
          if [ -f ios/Podfile ]; then
            cd ios && pod install --repo-update
          fi
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          # pubspec 的 +N 為保底 build 號（目前 TestFlight 已有到 (4)，pubspec 設 +5）
          PUBSPEC_BUILD=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/tmp/latest_build_err.log || echo "")
          if [ -n "$LATEST" ] && [ "$LATEST" -eq "$LATEST" ] 2>/dev/null; then
            NEXT=$((LATEST + 1))
            echo "✅ TestFlight 最新 build = $LATEST，本次使用 $NEXT"
          else
            echo "⚠️ 無法查詢 TestFlight 最新 build 號（請檢查 API 金鑰權限／App Apple ID）："
            cat /tmp/latest_build_err.log || true
            NEXT=$((BUILD_NUMBER + 1))
          fi
          if [ -n "$PUBSPEC_BUILD" ] && [ "$NEXT" -lt "$PUBSPEC_BUILD" ]; then
            NEXT=$PUBSPEC_BUILD
          fi
          echo "📦 Build number = $NEXT"
          flutter build ipa --release \
            --build-number=$NEXT \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

